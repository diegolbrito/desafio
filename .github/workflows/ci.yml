name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Usa o numero da PR quando existir (evento pull_request); cai para o ref
  # (push) caso contrario. Sem isso, uma execucao de pull_request disparada
  # tardiamente pelo GitHub (ex.: logo apos o merge da propria PR) pode acabar
  # no mesmo grupo de uma execucao de push na main e cancela-la sem motivo -
  # foi exatamente o que aconteceu na primeira rodada real deste workflow.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn test
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  docker-build-backend:
    name: Docker image build - backend (sem push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: credit-engine-backend:ci
          cache-from: type=gha,scope=backend
          # mode=min (nao "max"): so cacheia as camadas finais da imagem, nao os
          # estagios intermediarios de build (que incluiriam todo o repositorio
          # Maven baixado) - "max" esgotou o disco do runner (build de duas
          # imagens na mesma maquina, "failed to reserve cache" por falta de espaco).
          cache-to: type=gha,mode=min,scope=backend

  docker-build-frontend:
    name: Docker image build - frontend (sem push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: credit-engine-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker (sempre 127.0.0.11 dentro de um container). Sem isso,
    # o nginx resolve o hostname "backend" uma unica vez (na inicializacao do
    # worker) e mantem esse IP em cache pela vida do processo - se o container do
    # backend for recriado depois (ex.: durante desenvolvimento iterativo com
    # docker compose up --force-recreate backend, sem tambem recriar o frontend),
    # o nginx continua mandando trafego para o IP antigo, que o Docker pode ter
    # realocado para OUTRO container. Usar uma variavel no proxy_pass (em vez de
    # um host estatico) forca o nginx a resolver de novo a cada `valid` segundos.
    resolver 127.0.0.11 valid=10s;

    # Repassa chamadas de API para o servico backend (nome do servico no
    # docker-compose), mantendo o frontend e a API na mesma origem do ponto
    # de vista do navegador (sem necessidade de CORS neste cenario).
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Porta publica real (o backend so enxerga a porta interna 8080 sem isso),
        # usada pelo Spring (ForwardedHeaderFilter) para montar o header Location.
        proxy_set_header X-Forwarded-Port 3000;
    }

    # SPA: qualquer rota nao encontrada cai no index.html (react-router cuida do resto).
    location / {
        try_files $uri /index.html;
    }
}

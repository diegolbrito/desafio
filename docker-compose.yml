services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: credit_engine
      POSTGRES_USER: credit_engine
      POSTGRES_PASSWORD: credit_engine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_engine -d credit_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

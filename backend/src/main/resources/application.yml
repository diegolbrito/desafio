spring:
  application:
    name: credit-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_engine}
    username: ${DB_USER:credit_engine}
    password: ${DB_PASSWORD:credit_engine}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Respeita X-Forwarded-* (porta/proto) do nginx do frontend, senao o header
  # Location de um 201 fica com a porta interna do container, nao a publica.
  forward-headers-strategy: framework

credit-engine:
  # Spread fixo de custo operacional (fracao decimal, a.m.) somado a taxa base +
  # spread de risco na formula de desagio (ver SPEC.md, "Premissas adotadas" item 4).
  # Parametro estavel, por isso vive na aplicacao e nao em tabela de referencia no banco.
  custo-operacional: ${CUSTO_OPERACIONAL:0.000}
  # Cotacao de cambio (quantidade de BRL por 1 USD) usada para converter o resultado do
  # desagio quando moedaPagamento difere da moeda do titulo (cross-currency - ver SPEC.md,
  # "Premissas adotadas" item 3). Mesmo padrao de custo-operacional: parametro de aplicacao,
  # nao recebido via API, pois nao e' cadastro por recebivel, e' taxa vigente do sistema.
  cotacao-cambio: ${COTACAO_CAMBIO:5.20}
  cors:
    # Origens do frontend autorizadas a chamar a API (politica de navegador,
    # nao autenticacao). Lista separada por virgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
